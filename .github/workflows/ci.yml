name: Antigravity DataFlow CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Windows" ]; then
            pip install -r requirements-dev.txt pytest-cov flake8
          else
            # Linux runs the tests only: no desktop window (pywebview) and no PyInstaller. Flatten the -r includes.
            cat requirements.txt requirements-optional.txt requirements-dev.txt \
              | grep -vE "^(-r|#|pywebview|pyinstaller)|^$" | sort -u > /tmp/req-linux.txt
            pip install -r /tmp/req-linux.txt pytest-cov flake8
          fi

      - name: Install Playwright browser (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Lint (hard failures only)
        run: flake8 backend tests desktop --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test suite with coverage
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pytest tests -v --cov=backend --cov-report=term --cov-report=xml
          else
            # Linux covers the portable engine/API tests. The desktop shell, shortcuts, Edge/WebView2 diagnostics and
            # browser tests are Windows features and run on the Windows leg.
            pytest tests -v --cov=backend --cov-report=term --cov-report=xml \
              --ignore=tests/test_desktop_diagnostics.py --ignore=tests/test_desktop_packaging.py \
              --ignore=tests/test_e2e_browser.py --ignore=tests/test_exe_smoke.py --ignore=tests/test_native_dialogs.py
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml

      - name: Tests must not modify tracked files
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Test run changed tracked files:"; git status --porcelain --untracked-files=no; exit 1
          fi

  build-windows:
    name: Build EXE and installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build the application
        run: python build_desktop.py

      - name: Smoke-test the built EXE
        run: python -m pytest tests/test_exe_smoke.py -v
        env:
          DATAFLOW_EXE: dist/AntigravityDataFlow/AntigravityDataFlow.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $version = python -c "from backend._version import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\DataFlow.iss
          Get-ChildItem dist\installer\*.exe | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload installer and portable build
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/installer/*
            dist/*.zip
            dist/*.zip.sha256

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**
          generate_release_notes: true
